name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22.11]
    env:
      NODE_ENV: test
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - name: Setup node env 🏗
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Cache node_modules 📦
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Linting check
        run: pnpm run lint

      - name: Building application
        run: pnpm run build:ci

      - name: Type Check
        run: pnpm exec tsc --noEmit
